# PR：非 SK-la 作者自动 Sonar；SK-la 自己的 PR 不自动。
# 在 PR 评论 /sonar：SK-la 或 PR 作者可手动触发。
name: SonarQube

on:
  pull_request:
    types: [opened, synchronize, reopened]

  issue_comment:
    types: [created]

# 同一 PR 只保留最新 Sonar；不与 ci.yml 共用 group
concurrency:
  group: sonar-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:

  sonar-auto:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'SK-la'

    name: Sonar Auto Review
    runs-on: windows-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $beginArgs = @(
            "begin",
            "/k:SK-la_Ez2Lazer",
            "/o:sk-la",
            "/d:sonar.token=$env:SONAR_TOKEN",
            "/d:sonar.pullrequest.key=${{ github.event.pull_request.number }}",
            "/d:sonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}",
            "/d:sonar.pullrequest.base=${{ github.event.pull_request.base.ref }}"
          )
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" @beginArgs

          dotnet build -c Release osu.Desktop.slnf

          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" end "/d:sonar.token=$env:SONAR_TOKEN"


  sonar-manual:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/sonar') &&
      (
        github.event.comment.user.login == 'SK-la' ||
        github.event.comment.user.login == github.event.issue.user.login
      )

    name: Sonar Manual Review
    runs-on: windows-latest

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput('number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $beginArgs = @(
            "begin",
            "/k:SK-la_Ez2Lazer",
            "/o:sk-la",
            "/d:sonar.token=$env:SONAR_TOKEN",
            "/d:sonar.pullrequest.key=${{ steps.pr.outputs.number }}",
            "/d:sonar.pullrequest.branch=${{ steps.pr.outputs.head_ref }}",
            "/d:sonar.pullrequest.base=${{ steps.pr.outputs.base_ref }}"
          )
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" @beginArgs

          dotnet build -c Release osu.Desktop.slnf

          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" end "/d:sonar.token=$env:SONAR_TOKEN"